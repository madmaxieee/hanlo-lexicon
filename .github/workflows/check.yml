name: Check

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Test maintenance tools
        run: python3 -m unittest discover -s tests -v
      - name: Test TSBP tools
        run: python3 -m unittest discover -s tools/tsbp -v
      - name: Check formatting and validate entries
        run: |
          python3 tools/lexicon.py format --check
          python3 tools/lexicon.py validate
